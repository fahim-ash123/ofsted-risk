[project]
name = "ofsted-risk"
version = "0.1.7"
description = "Predicting decline risk at the next Ofsted inspection of Good schools"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "requests>=2.31", "pypdf>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
