[project]
name = "ofsted-risk"
version = "0.2.0"
description = "Predicting decline risk at the next Ofsted inspection of Good schools"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "requests>=2.31", "pypdf>=4.0", "scikit-learn>=1.6", "matplotlib>=3.8", "sentence-transformers"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
